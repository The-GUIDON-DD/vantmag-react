name: Test
on:
  pull_request:
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11 # Specify your major or exact version
          run-time: node@22 # Automatically installs Node.js
          cache: true
          run_install: false
      - name: Install Dependencies
        run: pnpm ci
      - name: Run vitest
        run: pnpm exec vitest run --reporter=default --reporter=github-actions
